<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur Ticket Taxi - Elidrissi Hicham</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Courier Prime', monospace; }
        #preview {
            white-space: pre-wrap;
            background: #fff;
            border: 1px dashed #ccc;
            max-width: 400px;
            font-size: 14px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            line-height: 1.3;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

<div class="bg-white p-6 rounded-xl shadow-lg grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl w-full">

    <div>
        <h2 class="text-2xl font-bold mb-4">Générateur Ticket</h2>
        
        <div class="grid grid-cols-2 gap-4 mb-3">
            <div>
                <label class="text-sm font-bold">Date</label>
                <input id="date" type="date" value="2026-02-23" class="border p-2 w-full rounded">
            </div>
            <div>
                <label class="text-sm font-bold">Distance (km)</label>
                <input id="distance" type="number" step="0.1" value="64.8" class="border p-2 w-full rounded">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-3">
            <div>
                <label class="text-sm font-bold">Heure Départ</label>
                <input id="start" type="time" value="12:54" class="border p-2 w-full rounded">
            </div>
            <div>
                <label class="text-sm font-bold">Heure Arrivée</label>
                <input id="end" type="time" value="13:52" class="border p-2 w-full rounded">
            </div>
        </div>

        <div class="mb-4">
            <label class="text-sm font-bold">Prix Total TTC (€)</label>
            <input id="price" type="number" step="0.01" value="135.24" class="border p-2 w-full rounded">
        </div>

        <button onclick="generate()" class="bg-black text-white font-bold w-full p-3 rounded hover:bg-gray-800 transition">
            Télécharger le Ticket PDF
        </button>
    </div>

    <div>
        <h3 class="font-bold mb-2 text-center text-lg">Aperçu en direct</h3>
        <div id="preview"></div>
    </div>

</div>

<script>
    const { jsPDF } = window.jspdf;

    function formatDateFR(dateStr) {
        if (!dateStr) return "";
        const [year, month, day] = dateStr.split("-");
        return `${day}/${month}/${year}`;
    }

    function padLR(left, right, width = 38) {
        const spaces = width - left.length - right.length;
        return left + " ".repeat(Math.max(1, spaces)) + right;
    }

    function updatePreview() {
        const dateStr = formatDateFR(document.getElementById("date").value);
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;
        const dist = parseFloat(document.getElementById("distance").value).toFixed(1);
        
        const ttc = parseFloat(document.getElementById("price").value) || 0;
        const ht = ttc / 1.10;
        const tva = ttc - ht;
        const priseEnCharge = 2.94;

        let html = "";
        html += "               TAXI\n";
        html += "         ELIDRISSI HICHAM\n\n";
        
        html += padLR("N° Stat.:", "1") + "\n";
        html += padLR("N° Immat.:", "FK-309-AA") + "\n";
        html += "Commune de rattachement:\n";
        html += "         MANTES LA JOLIE\n\n";
        
        html += padLR("Date:", dateStr) + "\n";
        html += padLR(`Départ:${start}`, `Arrivée:${end}`) + "\n";
        html += padLR("Distance:", `${dist} km`) + "\n";
        html += "Lieu départ:\n\n...................................\n\n";
        html += "Lieu arrivée:\n\n...................................\n\n";
        
        html += padLR("Prise en charge", `${priseEnCharge.toFixed(2)} €`) + "\n\n";
        
        html += padLR("TOTAL TTC", `${ttc.toFixed(2)} €`) + "\n";
        html += padLR("Total TVA 10.00%", `${tva.toFixed(2)} €`) + "\n";
        html += padLR("Total HT", `${ht.toFixed(2)} €`) + "\n\n";
        
        html += "Le tarif minimum, suppl.\ninclus, susceptible d'être\nperçu pour une course est\nfixé à  8.00 €\n\n";
        
        html += "Adresse de réclamation:\n";
        html += "    Prefecture des Yvelines\n";
        html += "  Bureau de la reglementation\n";
        html += "        General 1rue jean\n";
        html += "     Houdon 78010 Versailles\n";
        html += "              Cedex\n\n";
        
        html += "Nom client:\n\n...................................\n\n";
        html += "Adresse client:\n\n...................................\n\n";
        html += "Signature client:\n\n\n\n\n";
        html += "      Exemplaire chauffeur";

        document.getElementById("preview").innerText = html;
    }

    function generate() {
        updatePreview();

        const dateStr = formatDateFR(document.getElementById("date").value);
        const start = document.getElementById("start").value;
        const end = document.getElementById("end").value;
        const dist = parseFloat(document.getElementById("distance").value).toFixed(1);
        
        const ttc = parseFloat(document.getElementById("price").value) || 0;
        const ht = ttc / 1.10;
        const tva = ttc - ht;
        const priseEnCharge = 2.94;

        const doc = new jsPDF({ unit: "mm", format: [80, 260] });
        doc.setFont("Courier");
        doc.setFontSize(10); 
        
        let y = 15; 
        const leftX = 5;  
        const rightX = 75; 
        const centerX = 40; 

        // CORRECTED HELPER FUNCTIONS
        // This ensures the right-aligned text prints on the SAME line as the left text
        function printRow(leftText, rightText) {
            doc.text(leftText, leftX, y);
            doc.text(rightText, rightX, y, { align: "right" });
            y += 5; // Move down ONLY after both sides are printed
        }

        function printCenter(text) {
            doc.text(text, centerX, y, { align: "center" });
            y += 5;
        }

        function printLeft(text) {
            doc.text(text, leftX, y);
            y += 5;
        }

        function printDots() {
            printLeft("...................................");
        }

        // --- DÉBUT DU TICKET PDF ---

        printCenter("TAXI");
        printCenter("ELIDRISSI HICHAM");
        y += 4;

        printRow("N° Stat.:", "1");
        printRow("N° Immat.:", "FK-309-AA");
        printLeft("Commune de rattachement:");
        printCenter("MANTES LA JOLIE");
        y += 4;

        printRow("Date:", dateStr);
        printRow(`Départ:${start}`, `Arrivée:${end}`);
        printRow("Distance:", `${dist} km`);
        
        y += 2;
        printLeft("Lieu départ:");
        y += 1;
        printDots();
        y += 2;
        printLeft("Lieu arrivée:");
        y += 1;
        printDots();
        y += 4;

        printRow("Prise en charge", `${priseEnCharge.toFixed(2)} €`);
        y += 6;
        
        doc.setFont("Courier", "bold");
        printRow("TOTAL TTC", `${ttc.toFixed(2)} €`);
        doc.setFont("Courier", "normal");
        
        printRow("Total TVA 10.00%", `${tva.toFixed(2)} €`);
        printRow("Total HT", `${ht.toFixed(2)} €`);
        y += 6;

        // Legal text logic fixed for cleaner wrapping
        doc.setFontSize(9);
        const legalText = "Le tarif minimum, suppl. inclus, susceptible d'être perçu pour une course est fixé à 8.00 €";
        const splitLegalText = doc.splitTextToSize(legalText, 70);
        doc.text(splitLegalText, leftX, y);
        y += (splitLegalText.length * 4) + 6;

        printLeft("Adresse de réclamation:");
        // Properly center-aligned block of text
        const addressText = "Prefecture des Yvelines\nBureau de la reglementation\nGeneral 1rue jean\nHoudon 78010 Versailles\nCedex";
        doc.text(addressText, centerX, y, { align: "center" });
        y += 24; 

        doc.setFontSize(10);
        printLeft("Nom client:");
        y += 1;
        printDots();
        y += 2;
        printLeft("Adresse client:");
        y += 1;
        printDots();
        y += 2;
        printLeft("Signature client:");
        
        y += 18;
        printCenter("Exemplaire chauffeur");

        doc.save(`Ticket_${dateStr.replace(/\//g, "-")}.pdf`);
    }

    document.querySelectorAll("input").forEach(e => e.addEventListener("input", updatePreview));
    window.onload = updatePreview;
</script>

</body>
</html>
