<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur Ticket Taxi</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>

body{
font-family:'IBM Plex Mono',monospace;
background:#f3f4f6;
}

/* receipt */

#receipt-container{
font-family:'IBM Plex Mono','Courier New',monospace;
font-weight:300;
width:210px;
padding:6px 8px;
font-size:9px;
line-height:1.22;
letter-spacing:.3px;
background:#fff;
color:#000;
border:1px dashed #ccc;
margin:0 auto;
position:relative;

-webkit-font-smoothing:none;
text-rendering:optimizeSpeed;
filter:contrast(1.25) brightness(.96) blur(.15px);
}

/* thermal dots */

#receipt-container.preview-mode::before{
content:"";
position:absolute;
inset:0;
background-image:radial-gradient(rgba(0,0,0,.04) .4px, transparent .5px);
background-size:1.6px 1.6px;
opacity:.35;
pointer-events:none;
mix-blend-mode:multiply;
}

/* scanlines */

#receipt-container.preview-mode::after{
content:"";
position:absolute;
inset:0;
background:repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,.02) 2px,
rgba(0,0,0,.02) 3px
);
pointer-events:none;
}

/* burn edges */

#receipt-container.preview-mode{
box-shadow:
inset 0 6px 10px rgba(0,0,0,.05),
inset 0 -6px 10px rgba(0,0,0,.05);
}

/* layout */

.flex-row{
display:flex;
justify-content:space-between;
}

.center-text{
text-align:center;
}

.header{
text-align:center;
font-size:10px;
letter-spacing:1px;
line-height:1.4;
font-weight:400;
}

/* dotted separator */

.dots-line{
white-space:nowrap;
overflow:hidden;
letter-spacing:1px;
}

/* total row */

.total-ttc-row{
display:flex;
justify-content:space-between;
margin-top:4px;
}

.total-ttc-row span{
font-family:'VT323',monospace;
font-size:18px;
letter-spacing:1px;
}

/* number style */

.oz{
font-family:"Courier New",monospace!important;
}

</style>

</head>

<body class="flex justify-center items-center min-h-screen p-4">

<div class="bg-white p-6 rounded-xl shadow-lg grid md:grid-cols-2 gap-8 max-w-5xl w-full">

<div>

<h2 class="text-2xl font-bold mb-4">Générateur Ticket Taxi</h2>

<div class="grid grid-cols-2 gap-4 mb-3">

<div>
<label>Date</label>
<input id="date" type="date" value="2026-02-23" class="border p-2 w-full rounded">
</div>

<div>
<label>Distance</label>
<input id="distance" type="number" step="0.1" value="12.4" class="border p-2 w-full rounded">
</div>

</div>

<div class="grid grid-cols-2 gap-4 mb-3">

<div>
<label>Départ</label>
<input id="start" type="time" value="12:54" class="border p-2 w-full rounded">
</div>

<div>
<label>Arrivée</label>
<input id="end" type="time" value="13:12" class="border p-2 w-full rounded">
</div>

</div>

<div class="mb-4">
<label>Total TTC</label>
<input id="price" type="number" step="0.01" value="24.60" class="border p-2 w-full rounded">
</div>

<button onclick="generatePDF()" class="bg-indigo-600 text-white w-full py-3 rounded">
Télécharger le Ticket PDF
</button>

</div>

<div class="flex flex-col items-center">

<h3 class="font-semibold mb-4">Aperçu</h3>

<div id="receipt-container" class="preview-mode">

<div class="header">
TAXI<br>
ELIDRISSI HICHAM
</div>

<div style="height:8px"></div>

<div class="flex-row"><span>N° Stat.</span><span>1</span></div>
<div class="flex-row"><span>N° Immat.</span><span>FK-309-AA</span></div>

<div class="center-text">MANTES LA JOLIE</div>

<div style="height:8px"></div>

<div class="flex-row"><span>Date</span><span id="r-date"></span></div>

<div class="flex-row">
<span>Départ <span id="r-start"></span></span>
<span>Arrivée <span id="r-end"></span></span>
</div>

<div class="flex-row"><span>Distance</span><span id="r-dist"></span></div>

<div>Lieu départ</div>
<div class="dots-line">................................</div>

<div>Lieu arrivée</div>
<div class="dots-line">................................</div>

<div style="height:6px"></div>

<div class="flex-row"><span>Prise en charge</span><span>2.94 €</span></div>

<div class="total-ttc-row">
<span>TOTAL TTC</span>
<span id="r-ttc"></span>
</div>

<div class="flex-row"><span>Total TVA 10%</span><span id="r-tva"></span></div>
<div class="flex-row"><span>Total HT</span><span id="r-ht"></span></div>

<div style="height:8px"></div>

<div class="center-text">Exemplaire chauffeur</div>

</div>

</div>

</div>

<script>

function formatDateFR(d){
const [y,m,j]=d.split("-");
return `${j}/${m}/${y}`;
}

function updatePreview(){

document.getElementById("r-date").innerText=formatDateFR(document.getElementById("date").value)

document.getElementById("r-start").innerText=document.getElementById("start").value
document.getElementById("r-end").innerText=document.getElementById("end").value

document.getElementById("r-dist").innerText=parseFloat(document.getElementById("distance").value).toFixed(1)+" km"

const ttc=parseFloat(document.getElementById("price").value)||0
const ht=ttc/1.10
const tva=ttc-ht

document.getElementById("r-ttc").innerText=ttc.toFixed(2)+" €"
document.getElementById("r-tva").innerText=tva.toFixed(2)+" €"
document.getElementById("r-ht").innerText=ht.toFixed(2)+" €"

}

function generatePDF(){

updatePreview()

const el=document.getElementById("receipt-container")

el.classList.remove("preview-mode")
el.style.border="none"

const pdfH=Math.ceil((el.scrollHeight/96)*25.4)+8

html2pdf().set({
margin:[3,0,3,0],
filename:"taxi_ticket.pdf",
image:{type:'jpeg',quality:1},
html2canvas:{
scale:10,
useCORS:true,
backgroundColor:'#ffffff'
},
jsPDF:{unit:'mm',format:[58,pdfH],orientation:'portrait'}
}).from(el).save().then(()=>{

el.classList.add("preview-mode")
el.style.border="1px dashed #ccc"

})

}

document.querySelectorAll("input").forEach(e=>e.addEventListener("input",updatePreview))

window.onload=updatePreview

</script>

</body>
</html>
